<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Seat Booking</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>

    <div class="first">
        <div class="first-div">
            <h1>Event Seat Booking</h1>
            <p>Book your preferred seat easily</p>
        </div>
       

        <section class="second">
            <h2> Information</h2>
            <div class="Information">
                <div class="input-data">
                    <label for="Name"> Name</label>
                    <input type="text"id="Name" placeholder="Enter your name">
                </div>

                <div class="input-data">
                    <label for="Id"> ID</label>
                    <input type="text"id="Id" placeholder="Enter your ID">
                </div>

                <div class="input-data">
                    <label for="domain">Seat Category</label>

                    <select id="SeatCategory">
                        <option value="">Select Seat</option>
                        <option value="VIP">VIP</option>
                        <option value="Premium">Premium</option>
                        <option value="Regular">Regular</option>
                 </select>
                </div>

                <div class="input-data">
                    <label for="Venue">Venue</label>
                    <select id="Venue">
                        <option value="">Select Venue</option>
                        <option value="Vedanta Farm">Vedanta Farm</option>
                        
                    </select>
                </div>

            </div>

        </section>


       
        <section class="card">
          <h2>Select Your Seat</h2>
             <div class="seat-information">
                 <div>
                    <span class="legend available"></span>
                    Available
                </div>

                <div>
                    <span class="legend selected"></span>
                    Selected
                </div>

                <div>
                    <span class="legend booked"></span>
                    Booked
                </div>

            </div>

          <div id="seatContainer" class="seat-container"></div>
          </section>


        
        <section class="summary">
             <h2>Booking Summary</h2>
             <div class="summary-line">
                <span>Name</span>
                <strong id="summaryName">---</strong>
            </div>

            <div class="summary-line">
                <span> ID</span>
                <strong id="summaryId">---</strong>
            </div>

            <div class="summary-line">
                <span>Seat Category</span>
                <strong id="summarySeatCategory">---</strong>
            </div>

            <div class="summary-line">
                <span>Venue</span>
                <strong id="summaryVenue">---</strong>
            </div>

            <div class="summary-line">
                <span>Selected Seat</span>
                <strong id="summarySeat">---</strong>
            </div>

            <div class="summary-line total">
                <span>Total Price</span>
                <strong>Rs<span id="totalPrice">0</span></strong>
            </div>
            <button id="confirm" class="confirm">
                Confirm Booking
            </button>
        
        </section>

        <section id="result" class="button result">
            <h2>Booking Confirmed!</h2>
              <div id="resultfinal"></div>
        </section>
        
        <button id="reset" class="reset-button">
            Reset Booking
        </button>

        </div>


    <script src="script.js"></script>

</body>
</html>
